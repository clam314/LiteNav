name: Chrome extension

# Builds the Chrome extension after every change on main and publishes the
# zip as the extension-latest release, replacing the previous build, so its
# download link never changes. Catalog refreshes are pushed with the workflow
# token, which starts no workflows: companion-catalogs.yml starts this one.
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'extension/**'
      - 'seed.json'
      - 'LICENSE'
      - 'package.json'
      - 'scripts/build_extension.py'
      - '.github/extension-release-notice.md'
      - '.github/workflows/extension.yml'
  workflow_dispatch:

permissions:
  contents: read

# One release at a time; a newer change waits and then replaces it.
concurrency:
  group: chrome-extension
  cancel-in-progress: false

jobs:
  test:
    name: JavaScript and Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Run JavaScript tests
        run: node --test tests/*.test.mjs

      - name: Run Python tests
        run: python -m unittest discover -s tests

  package:
    name: Build and publish the extension zip
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      # The run number is the fourth version number, so every build is newer.
      - name: Build the extension
        run: |
          python scripts/build_extension.py --build-number "$GITHUB_RUN_NUMBER"
          version=$(python -c 'import json; print(json.load(open("dist/extension/manifest.json"))["version"])')
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          cp "dist/litenav-extension-$version.zip" dist/litenav-extension.zip
          (cd dist && sha256sum "litenav-extension-$version.zip" litenav-extension.zip > SHA256SUMS.txt)

      - name: Write release notes
        run: |
          # A notice for this period (an upgrade that needs a step), when there is one.
          if [ -f .github/extension-release-notice.md ]; then cat .github/extension-release-notice.md > dist/notice.md; printf '\n' >> dist/notice.md; else : > dist/notice.md; fi
          cat > dist/release-notes.md <<EOF
          轻航 LiteNav Chrome 插件 ${VERSION}，由 ${GITHUB_SHA:0:7} 自动构建。

          **安装**：下载 \`litenav-extension.zip\` 并解压，在 Chrome 打开 \`chrome://extensions\`，开启右上角“开发者模式”，点“加载已解压的扩展程序”，选择解压出的文件夹。更新时下载新的压缩包，解压覆盖原文件夹后在扩展程序页面点“重新加载”。

          **许可**：PolyForm Noncommercial 1.0.0，仅限非商业用途；转发或修改后分发须附带许可协议与原作者信息（见压缩包内的 LICENSE）。角色素材的权利归原权利人所有。
          EOF
          cat dist/notice.md dist/release-notes.md > dist/release-notes-full.md && mv dist/release-notes-full.md dist/release-notes.md

      - name: Publish the extension-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete extension-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create extension-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Chrome 插件 $VERSION" --notes-file dist/release-notes.md --latest \
            dist/litenav-extension.zip "dist/litenav-extension-$VERSION.zip" dist/SHA256SUMS.txt
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/extension-latest/litenav-extension.zip"
          printf '### Chrome extension %s\n\n%s\n' "$VERSION" "$url" >> "$GITHUB_STEP_SUMMARY"

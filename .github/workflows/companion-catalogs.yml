name: Companion catalogs

# Refresh the Brown Dust 2, NIKKE and Azur Lane character catalogs from their
# upstream sources once a week. Changes are committed to main and the image
# workflow is started, since pushes made with the workflow token start no other
# workflows.
on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: companion-catalogs
  cancel-in-progress: false

jobs:
  update:
    name: Update catalogs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Refresh catalogs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_companion.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run tests against the refreshed catalogs
        run: |
          node --test tests/*.test.mjs
          python -m unittest discover -s tests

      - name: Commit and rebuild the image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/companion; then
            echo "Catalogs are up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/companion/catalog.json public/companion/bd2-performances.json public/companion/nikke/catalog.json public/companion/azurlane/catalog.json
          git commit -m 'Update companion catalogs from upstream sources'
          git push
          gh workflow run docker.yml --ref "$GITHUB_REF_NAME"

name: Docker

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: JavaScript and Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Run JavaScript tests
        run: node --test tests/*.test.mjs

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Install browser test dependencies
        run: |
          python -m pip install -r tests/requirements-browser.txt
          python -m playwright install --with-deps chromium

      - name: Verify companion controls in a real browser
        run: python tests/companion_ui_browser.py

  build-pr:
    name: Build pull request image
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Pull requests never receive package write permission or registry credentials.
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build both architectures without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: false
          cache-from: type=gha,scope=litenav

  publish:
    name: Publish GHCR image
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve image name from the current repository
        shell: bash
        run: |
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          printf 'IMAGE_NAME=%s/%s\n' "$REGISTRY" "$repository" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Generate image tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=轻航 LiteNav
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # latest follows main; release/pre-release tags cannot move it.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish both architectures
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=litenav
          cache-to: type=gha,mode=max,scope=litenav

      - name: Smoke test the published image
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs litenav-smoke || true
            fi
            docker rm -f litenav-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker buildx imagetools inspect --raw "$IMAGE_NAME@$IMAGE_DIGEST" > /tmp/litenav-manifest.json
          python3 -c 'import json; m=json.load(open("/tmp/litenav-manifest.json")); p={(x.get("platform",{}).get("os"),x.get("platform",{}).get("architecture")) for x in m["manifests"]}; assert {("linux","amd64"),("linux","arm64")} <= p; print("Both image architectures verified")'
          docker run --detach --name litenav-smoke --publish 127.0.0.1:18765:8765 "$IMAGE_NAME@$IMAGE_DIGEST"
          ready=false
          for attempt in {1..45}; do
            test "$(docker inspect --format '{{.State.Running}}' litenav-smoke)" = "true"
            if curl --fail --silent --connect-timeout 1 --max-time 2 http://127.0.0.1:18765/api/health >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = "true"
          curl --fail --silent --show-error http://127.0.0.1:18765/api/state --output /tmp/litenav-state.json
          python3 -c 'import json; s=json.load(open("/tmp/litenav-state.json")); assert s["links"]; assert all(x["kind"] == "website" and not x["monitorEnabled"] for x in s["links"]); print("Public default configuration verified")'
          test "$(docker exec litenav-smoke id -u)" = "10001"

      - name: Record published digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '### Published image\n\n`%s@%s`\n' "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

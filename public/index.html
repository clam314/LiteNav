<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="description" content="把常用网址和自己的服务，放在一个顺手的地方。" />
    <title>归航 · 我的导航</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/companion.css" />
  </head>
  <body>
    <div id="app">
      <div class="loading-shell" role="status" aria-label="正在载入导航">
        <aside class="loading-sidebar" aria-hidden="true">
          <div class="skeleton skeleton-brand"></div>
          <div class="skeleton skeleton-nav"></div>
          <div class="skeleton skeleton-nav"></div>
          <div class="skeleton skeleton-nav"></div>
          <div class="skeleton skeleton-nav"></div>
        </aside>
        <main class="loading-main">
          <div class="loading-topbar"><div class="skeleton skeleton-title"></div></div>
          <div class="loading-content" aria-hidden="true">
            <div class="skeleton skeleton-label"></div>
            <div class="skeleton skeleton-favorites"></div>
            <div class="skeleton skeleton-label"></div>
            <div class="loading-columns">
              <div class="skeleton skeleton-card"></div>
              <div class="skeleton skeleton-card"></div>
              <div class="skeleton skeleton-card"></div>
            </div>
          </div>
          <span class="sr-only">正在载入导航…</span>
        </main>
      </div>
    </div>
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="companion-root"></div>
    <input id="import-file" type="file" accept="application/json,.json" hidden />
    <noscript><p class="noscript-message">请启用 JavaScript 来使用归航。</p></noscript>
    <script type="module" src="/app.js"></script>
  </body>
</html>
